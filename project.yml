name: LFAZGaleria
options:
  bundleIdPrefix: com.lfaz
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.6.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LFAZGaleria:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lfaz.galeria.ios
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CLANG_CXX_LIBRARY: libc++
    dependencies:
      # Official VideoLAN build, fetched and checksum-verified by scripts/vlckit.sh; plays MKV, AVI…
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
      - sdk: libc++.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: AudioToolbox.framework
      - sdk: OpenGLES.framework
      - sdk: CoreGraphics.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CFNetwork.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: Network.framework
  LFAZGaleriaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LFAZGaleria
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LFAZGaleria:
    build:
      targets:
        LFAZGaleria: all
        LFAZGaleriaTests: [test]
    test:
      targets: [LFAZGaleriaTests]

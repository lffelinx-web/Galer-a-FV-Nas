name: Compilar LF'AZ Galería
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Caché de VLCKit
        uses: actions/cache@v4
        with:
          path: Vendor
          key: vlckit-c649c4c47bd065b3a5511746361b5a9066a34033f2df9cbc9454409c0f363b52-arm64
      - name: Descargar VLCKit oficial
        run: bash scripts/vlckit.sh
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar para pruebas
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project LFAZGaleria.xcodeproj -scheme LFAZGaleria -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-tests CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Probar en simulador
        shell: bash
        timeout-minutes: 40
        run: |
          # A fresh simulator for each attempt: the preinstalled ones sometimes hang while booting.
          # Same model and iOS as an iPhone simulator that is already installed.
          read -r TYPE RUNTIME < <(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["deviceTypeIdentifier"] + " " + r for r, group in d.items() if "iOS" in r for v in group if v["name"].startswith("iPhone")))')
          attempt() {
            DEVICE=$(xcrun simctl create "Pruebas-$1" "$TYPE" "$RUNTIME")
            xcrun simctl boot "$DEVICE" || true
            if ! perl -e 'alarm shift; exec @ARGV' 480 xcrun simctl bootstatus "$DEVICE" -b; then
              echo "::warning::El simulador no arrancó a tiempo (intento $1)."
              xcrun simctl delete "$DEVICE" || true
              return 1
            fi
            rm -rf TestResults.xcresult
            perl -e 'alarm shift; exec @ARGV' 600 xcodebuild -project LFAZGaleria.xcodeproj -scheme LFAZGaleria -destination "platform=iOS Simulator,id=$DEVICE" \
              -derivedDataPath build-tests -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test-without-building
            local status=$?
            xcrun simctl shutdown "$DEVICE" || true
            xcrun simctl delete "$DEVICE" || true
            return $status
          }
          attempt 1 || attempt 2
      - name: Compilar IPA sin firmar
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project LFAZGaleria.xcodeproj -scheme LFAZGaleria -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p entrega/Payload
          cp -R build/Build/Products/Release-iphoneos/LFAZGaleria.app entrega/Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' entrega/Payload/LFAZGaleria.app/Info.plist)
          cd entrega && zip -qry "LFAZ-Galeria-$VERSION-sin-firmar.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LFAZ-Galeria-sin-firmar
          path: entrega/*.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resultados-XCTest
          path: TestResults.xcresult
          if-no-files-found: ignore
  testflight:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}${{ github.run_attempt }}
      MATCH_GIT_URL: https://github.com/${{ github.repository }}.git
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '6'
    steps:
      - name: Comprobar credenciales de Apple
        id: credenciales
        shell: bash
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::notice::Falta el secret $name; se omite la subida a TestFlight."; echo "listo=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "listo=si" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.credenciales.outputs.listo == 'si'
      - name: Caché de VLCKit
        if: steps.credenciales.outputs.listo == 'si'
        uses: actions/cache@v4
        with:
          path: Vendor
          key: vlckit-c649c4c47bd065b3a5511746361b5a9066a34033f2df9cbc9454409c0f363b52-arm64
      - name: Descargar VLCKit oficial
        if: steps.credenciales.outputs.listo == 'si'
        run: bash scripts/vlckit.sh
      - name: Preparar proyecto y fastlane
        if: steps.credenciales.outputs.listo == 'si'
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          brew install xcodegen
          command -v fastlane >/dev/null || brew install fastlane
          xcodegen generate
          # The certificate is encrypted with a password derived from the API key, so no extra secret is needed.
          PASSWORD=$(printf '%s' "$ASC_KEY_P8" | shasum -a 256 | cut -d' ' -f1)
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$PASSWORD"; echo "::add-mask::$AUTH"
          echo "MATCH_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "MATCH_GIT_AUTH=$AUTH" >> "$GITHUB_ENV"
      - name: Firmar y subir a TestFlight
        if: steps.credenciales.outputs.listo == 'si'
        run: fastlane beta
      - name: Aviso
        if: steps.credenciales.outputs.listo == 'si'
        run: echo "::notice::Compilación $BUILD_NUMBER enviada a App Store Connect. Aparecerá en TestFlight cuando Apple termine de procesarla."
